# upstream-map.conf - maps local config names to upstream sample names.
# Lines: local_basename=upstream_basename (no .sample extension)
#        ignore:<local basename or stock path>=<reason>   never reported
#        stock:<path under --config-dir>=<sample path under root/defaults/nginx>
# Example:
# calibre-cs.subdomain.conf=calibre-web.subdomain.conf
# ignore:example.subdomain.conf=intentional rewrite
# stock:ssl.conf=ssl.conf.sample
# stock:proxy.conf=proxy.conf.sample
